<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Movement App</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111820;
color:white;
}
.container{
max-width:700px;
margin:auto;
padding:20px;
}
.card{
background:#1b2430;
padding:20px;
border-radius:16px;
}
h1{margin-top:0}
input{
width:100%;
padding:16px;
font-size:18px;
border-radius:12px;
border:1px solid #444;
background:#111;
color:#fff;
box-sizing:border-box;
}
button{
width:100%;
padding:16px;
font-size:18px;
border:none;
border-radius:12px;
margin-top:12px;
cursor:pointer;
}
.next{
background:#d4af37;
color:#111;
font-weight:bold;
}
.back{
background:#333;
color:white;
}
.progress{
height:10px;
background:#333;
border-radius:10px;
margin-bottom:20px;
overflow:hidden;
}
.bar{
height:100%;
background:#d4af37;
width:0%;
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>Machine Movement App</h1>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="app"></div>
</div>
</div>

<script>
const steps=[
["Current Site","currentSite"],
["Destination","destination"],
["Machine Name","machineName"],
["Model","model"],
["Stock Number","stock"],
["Serial Number","serial"]
];

let current=0;
let data={};

function render(){
const app=document.getElementById("app");
document.getElementById("bar").style.width=((current)/steps.length*100)+"%";

if(current<steps.length){
app.innerHTML=`
<h2>${steps[current][0]}</h2>
<input id="field" value="${data[steps[current][1]]||''}">
<button class="next" onclick="nextStep()">Next</button>
${current>0?'<button class="back" onclick="backStep()">Back</button>':''}
`;
}else{
app.innerHTML=`
<h2>Review</h2>
<p><strong>Current Site:</strong> ${data.currentSite||''}</p>
<p><strong>Destination:</strong> ${data.destination||''}</p>
<p><strong>Machine Name:</strong> ${data.machineName||''}</p>
<p><strong>Model:</strong> ${data.model||''}</p>
<p><strong>Stock Number:</strong> ${data.stock||''}</p>
<p><strong>Serial Number:</strong> ${data.serial||''}</p>
<button class="next" onclick="window.print()">Print / Save PDF</button>
`;
}
}

function nextStep(){
const field=document.getElementById("field");
if(!field.value.trim()) return;
data[steps[current][1]]=field.value.trim();
current++;
render();
}

function backStep(){
current--;
render();
}

render();
</script>
</body>
</html>
